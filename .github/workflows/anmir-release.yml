name: Anmir macOS release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes embedded in update.json
        required: false
        type: string
      publish:
        description: Publish a completed build after the APK was signed locally
        required: false
        type: boolean
        default: false
      build_run_id:
        description: Completed build run to publish (skip rebuilding)
        required: false
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/anmir-release.yml]

permissions:
  contents: read

concurrency:
  group: anmir-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  server:
    if: inputs.build_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test companion protocol
        run: bash release/test_companion.sh
      - name: Build unsigned Anmir Connect
        run: bash release/build_companion.sh release/work/build-companion
      - uses: actions/upload-artifact@v7
        with:
          name: anmir-companion
          path: release/work/build-companion/AnmirConnect-unsigned.apk
          if-no-files-found: error
      - name: Build mirroring server
        run: |
          mkdir -p release/work/build-server
          BUILD_DIR="$PWD/release/work/build-server" bash server/build_without_gradle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: anmir-server
          path: release/work/build-server/scrcpy-server
          if-no-files-found: error

  macos:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v6
      - name: Check native compatibility before building dependencies
        run: |
          xcrun clang -fobjc-arc -Iapp/src -framework AppKit \
            app/tests/test_theme_chooser.m app/src/sys/macos/theme_chooser.m \
            app/src/sys/macos/device_ui.m app/src/sys/macos/localization.m \
            -o "$RUNNER_TEMP/anmir-test-theme"
          "$RUNNER_TEMP/anmir-test-theme"
          xcrun clang -fobjc-arc -Iapp/src -framework AppKit \
            app/tests/test_device_ui.m app/src/sys/macos/device_ui.m \
            app/src/sys/macos/localization.m -o "$RUNNER_TEMP/anmir-test-icons"
          "$RUNNER_TEMP/anmir-test-icons" "$PWD/app/data/scrcpy.icns"
          xcrun clang -fobjc-arc -Iapp/src -framework Foundation \
            app/tests/test_device_support.m app/src/sys/macos/device_support.m \
            -o "$RUNNER_TEMP/anmir-test-pipes"
          "$RUNNER_TEMP/anmir-test-pipes"
      - name: Install build dependencies
        run: brew install meson ninja cmake nasm pkg-config zlib automake autoconf libtool wget
      - name: Install installer builder
        run: |
          python3 -m venv release/work/dmgbuild-env
          release/work/dmgbuild-env/bin/pip install dmgbuild==1.6.7
          echo "DMGBUILD=$PWD/release/work/dmgbuild-env/bin/dmgbuild" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: anmir-server
          path: release/work/build-server
      - name: Build native client
        run: bash release/build_macos.sh '${{ matrix.arch }}'
      - name: Test client
        run: |
          export PKG_CONFIG_LIBDIR="$PWD/app/deps/work/install/macos-native-static/lib/pkgconfig"
          meson setup build-tests --buildtype=debug -Dcompile_server=false -Dstatic=true \
            -Dc_args="-I$PWD/app/deps/work/install/macos-native-static/include" \
            -Dc_link_args="-L$PWD/app/deps/work/install/macos-native-static/lib"
          meson test -C build-tests --num-processes 1 --print-errorlogs
      - name: Package app, DMG and ZIP
        run: |
          bash release/build_macos_app.sh --dmg --zip \
            --server "$PWD/release/work/build-server/scrcpy-server" \
            'release/work/build-macos-${{ matrix.arch }}'
          test "$(lipo -archs dist/Anmir.app/Contents/MacOS/anmir)" = '${{ matrix.arch }}'
          dist/Anmir.app/Contents/MacOS/anmir --version
          codesign --verify --deep --strict dist/Anmir.app
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Package complete source
        if: matrix.arch == 'arm64'
        run: bash release/package_sources.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: anmir-macos-${{ matrix.arch }}
          path: |
            dist/Anmir-*.dmg
            dist/Anmir-*.zip
            dist/Anmir-*-source.tar.gz
          if-no-files-found: error

  release-artifacts:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: anmir-macos-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: anmir-companion
          path: dist
      - name: Generate static update manifest and checksums
        env:
          RELEASE_NOTES: ${{ inputs.release_notes || '' }}
        run: |
          version="$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n 1)"
          mv dist/AnmirConnect-unsigned.apk "dist/AnmirConnect-$version-unsigned.apk"
          if [[ -z "$RELEASE_NOTES" && -f "release/notes/$version.md" ]]; then
            bash release/generate_update_manifest.sh dist "release/notes/$version.md"
          else
            bash release/generate_update_manifest.sh dist
          fi
          (cd dist && sha256sum Anmir-*.dmg Anmir-*.zip Anmir-*-source.tar.gz AnmirConnect-*.apk update.json > SHA256SUMS)
          jq . dist/update.json
      - uses: actions/upload-artifact@v7
        with:
          name: anmir-release
          path: |
            dist/Anmir-*.dmg
            dist/Anmir-*.zip
            dist/Anmir-*-source.tar.gz
            dist/SHA256SUMS
            dist/update.json
            dist/AnmirConnect-*.apk
          if-no-files-found: error

  publish:
    needs: release-artifacts
    if: always() && !cancelled() && github.repository == 'houzi3/Anmir' && github.ref == 'refs/heads/main' && inputs.publish && (needs.release-artifacts.result == 'success' || inputs.build_run_id != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Show required repository permission
        run: |
          message="Release publishing and the automatic version bump require Settings > Actions > General > Workflow permissions > Read and write permissions. Any main branch protection must also allow github-actions[bot] to push."
          echo "::notice title=GitHub Actions write access required::$message"
          {
            echo "### GitHub Actions write access required"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: anmir-release
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
      - name: Validate source build and signed APK
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.run_id }}
        run: |
          bash release/prepare_signed_release.sh dist "$BUILD_RUN_ID"
      - name: Validate release payload
        id: version
        run: |
          version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' dist/update.json)"
          test -f "dist/Anmir-$version-arm64.zip"
          test -f "dist/Anmir-$version-x86_64.zip"
          test -f "dist/Anmir-$version-arm64.dmg"
          test -f "dist/Anmir-$version-x86_64.dmg"
          test -f "dist/Anmir-$version-source.tar.gz"
          test -f "dist/AnmirConnect-$version.apk"
          (cd dist && sha256sum -c SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.payload.outputs.source_sha }}
        run: |
          tag="v$VERSION"
          jq -r '.notes' dist/update.json > "$RUNNER_TEMP/release-notes.md"
          release_files=(
            "dist/Anmir-$VERSION-arm64.dmg"
            "dist/Anmir-$VERSION-arm64.zip"
            "dist/Anmir-$VERSION-x86_64.dmg"
            "dist/Anmir-$VERSION-x86_64.zip"
            "dist/Anmir-$VERSION-source.tar.gz"
            "dist/SHA256SUMS"
            "dist/AnmirConnect-$VERSION.apk"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Release $tag is already published; refusing to replace its assets." >&2
              exit 1
            fi
            gh release upload "$tag" "${release_files[@]}" --clobber
            gh release upload "$tag" dist/update.json --clobber
          else
            gh release create "$tag" "${release_files[@]}" dist/update.json \
              --target "$RELEASE_SHA" --title "Anmir $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release edit "$tag" --draft=false --prerelease=false

  bump-version:
    needs: publish
    if: github.repository == 'houzi3/Anmir' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Advance to the next patch version
        env:
          RELEASED_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          current="$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n 1)"
          if [[ "$current" != "$RELEASED_VERSION" ]]; then
            echo "Version is already $current; released $RELEASED_VERSION, so no bump is needed."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((10#$patch + 1))"
          ./bump_version "$next"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meson.build server/build.gradle server/build_without_gradle.sh companion/build.gradle app/scrcpy-windows.rc
          git commit -m "chore: prepare Anmir $next"
          git push origin HEAD:main
